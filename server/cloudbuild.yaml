steps:
  # 1. Build Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/brightmed-voice-service:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/brightmed-voice-service:latest'
      - '.'

  # 2. Push Image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/brightmed-voice-service:$COMMIT_SHA'

  # 3. Deploy to Cloud Run (Scale to zero, 3600s timeout)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'brightmed-voice-service'
      - '--image'
      - 'gcr.io/$PROJECT_ID/brightmed-voice-service:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--timeout'
      - '3600'
      - '--session-affinity'
      - '--port'
      - '8080'

images:
  - 'gcr.io/$PROJECT_ID/brightmed-voice-service:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/brightmed-voice-service:latest'
